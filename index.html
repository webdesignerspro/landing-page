<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing-Page</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="px-5 pt-3 bg-blue-950 text-white md:px-10">
    <header class="flex justify-between md:mb-7">
        <p class="text-3xl">Precious</p>
        <nav class="hidden md:block">
            <ul class="flex gap-10">
                <li class="md:block md:hover:underline md:hover:text-blue-700 md:hover:underline-offset-8"><a href="#">Home</a></li>
                <li class="md:block md:hover:underline md:hover:text-blue-700 md:hover:underline-offset-8"><a href="#">About</a></li>
                <li class="md:block md:hover:underline md:hover:text-blue-700 md:hover:underline-offset-8"><a href="#">Skill</a></li>
                <li class="md:block md:hover:underline md:hover:text-blue-700 md:hover:underline-offset-8"><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="md:hidden"><i class="fa-solid fa-bars text-3xl"></i></div>

    </header>
    <main>
        <section>
            <div class="md:flex md:gap-45">
                <div class="pt-9 order-2 flex justify-center">
                    <img src="img/beto.jpg" alt="profile_picture" class="rounded-2xl md:w-110 md:h-120 w-full">
                </div>
                <div class="md:order-1 md:ml-0 md:mt-10">
                    <h1 class="mt-3 text-3xl">Hello, I'm</h1>
                    <p class="text-6xl text-blue-400 mb-5 md:text-9xl md:mb-6">Precious</p>
                    <p class="mb-4 text-[0.9rem] md:text-2xl md:leading-10 md:mb-13">
                        I'm a passionate and hardworking
                        learner <br> who loves technology,
                        design and building <br>cool things.
                        I'm always eager to improve <br>
                        and explore new opportunities
                    </p>
                    <div class="flex justify-center bg-blue-500 rounded-3xl mb-10 md:w-45 md:py-2 hover:bg-white hover:text-blue-800">
                        <button class="py-3 hover:text-blue-800">Contact Me</button>
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>

</html>
